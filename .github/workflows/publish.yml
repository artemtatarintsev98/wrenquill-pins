name: Publish pins to RSS feed

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Move next 3 due pins into feed.xml
        run: python3 publish.py --count 3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add feed.xml queue.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Publish pins $(date -u +%F)" && git push)
